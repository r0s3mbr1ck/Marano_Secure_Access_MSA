<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - MSA</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/msa-favicon.svg') }}">
  <style>
    :root {
      --bg-1: #0f1f5c;
      --bg-2: #142b79;
      --panel: rgba(22, 40, 104, 0.92);
      --panel-border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --input-bg: rgba(255,255,255,0.94);
      --input-text: #0f172a;
      --button: #52b6ff;
      --button-hover: #67c0ff;
      --button-soft: rgba(255,255,255,0.08);
      --button-soft-hover: rgba(255,255,255,0.14);
      --shadow: 0 24px 60px rgba(0,0,0,0.38);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(96,165,250,0.18), transparent 28%),
        radial-gradient(circle at bottom left, rgba(59,130,246,0.14), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .shell {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px;
      backdrop-filter: blur(8px);
    }

    .title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .flash {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .input-wrap {
      margin-bottom: 16px;
    }

    .input-wrap input {
      width: 100%;
      height: 64px;
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 0 18px;
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 18px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-weight: 800;
      background: var(--button);
      color: white;
    }

    .btn:hover {
      background: var(--button-hover);
    }

    .btn-secondary {
      background: var(--button-soft);
      color: white;
    }

    .btn-secondary:hover {
      background: var(--button-soft-hover);
    }

    @media (max-width: 640px) {
      .card { padding: 24px 20px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="title">Change Password</div>
      <div class="subtitle">{{ user.username }} · {{ user.access_type }}</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash">{{ messages[0][1] }}</div>
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="input-wrap">
          <input type="password" name="current_password" placeholder="Current password" required>
        </div>

        <div class="input-wrap">
          <input type="password" name="new_password" placeholder="New password" required>
        </div>

        <div class="input-wrap">
          <input type="password" name="confirm_password" placeholder="Confirm new password" required>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Update Password</button>
          <a class="btn btn-secondary" href="{{ url_for('user_dashboard') }}">Back</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
