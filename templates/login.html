<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marano Secure Access - Login</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/msa-favicon.svg') }}">
  <style>
    :root {
      --bg-1: #0f1f5c;
      --bg-2: #142b79;
      --panel: rgba(22, 40, 104, 0.92);
      --panel-border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --input-bg: rgba(255,255,255,0.94);
      --input-text: #0f172a;
      --button: #52b6ff;
      --button-hover: #67c0ff;
      --shadow: 0 24px 60px rgba(0,0,0,0.38);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(96,165,250,0.18), transparent 28%),
        radial-gradient(circle at bottom left, rgba(59,130,246,0.14), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .login-shell {
      width: 100%;
      max-width: 760px;
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 54px 30px;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 12px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.14));
      flex: 0 0 auto;
    }

    .brand-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .brand-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 34px;
    }

    .flash-error {
      width: 100%;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.28);
      color: #fecaca;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-wrap input {
      width: 100%;
      height: 74px;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 0 22px;
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 20px;
      font-weight: 500;
    }

    .input-wrap input::placeholder {
      color: #64748b;
      font-size: 18px;
    }

    .form-group-2fa {
      width: 100%;
      margin: 8px 0 18px;
      text-align: center;
    }

    .form-group-2fa label {
      display: block;
      width: 100%;
      text-align: center;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 8px 0;
    }

    .input-2fa {
      display: block;
      width: 180px !important;
      max-width: 180px;
      min-width: 180px;
      height: 42px;
      margin: 0 auto;
      padding: 0 12px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--input-text) !important;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 6px;
      font-family: monospace;
    }

    .submit-row {
      margin-top: 10px;
      width: 100%;
    }

    .submit-row button {
      width: 100%;
      height: 74px;
      border: none;
      outline: none;
      border-radius: 16px;
      background: var(--button);
      color: white;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 12px 28px rgba(59,130,246,0.28);
      display: block;
    }

    .submit-row button:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      font-weight: 600;
    }

    .footer strong {
      color: #e2e8f0;
    }

    @media (max-width: 640px) {
      .login-shell {
        max-width: 100%;
      }

      .login-card {
        padding: 28px 20px 20px;
      }

      .brand {
        gap: 12px;
      }

      .brand-logo {
        width: 48px;
        height: 48px;
      }

      .brand-title {
        font-size: 22px;
      }

      .brand-subtitle {
        font-size: 16px;
      }

      .input-wrap input,
      .submit-row button {
        height: 60px;
        font-size: 18px;
      }

      .submit-row button {
        font-size: 20px;
      }

      .form-group-2fa label {
        font-size: 15px;
      }

      .input-2fa {
        width: 160px !important;
        max-width: 160px;
        min-width: 160px;
        height: 40px;
        font-size: 17px;
        letter-spacing: 5px;
      }

      .footer {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand">
        <img class="brand-logo" src="{{ url_for('static', filename='img/msa-favicon.svg') }}" alt="MSA Logo">
      </div>

      <div class="brand-subtitle">
        Marano Secure Access
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="post" autocomplete="off">
        <div class="form-group">
          <div class="input-wrap">
            <input name="username" placeholder="Username" required>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrap">
            <input name="password" type="password" placeholder="Password" required>
          </div>
        </div>

        <div class="form-group-2fa">
          <label for="otp_code">2FA Code</label>
          <input
            id="otp_code"
            type="text"
            name="otp_code"
            class="input-2fa"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            required
          >
        </div>

        <div class="submit-row">
          <button type="submit">Sign in</button>
        </div>
      </form>

      <div class="footer">
        <strong>MSA</strong> · Marano Secure Access<br>
        Version 1.0
      </div>
    </div>
  </div>
</body>
</html>
