{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Registry (ID -> CN -> expiration)</h2>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>CN</th>
          <th>Created At</th>
          <th>Expires At</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr>
          <td>{{ r.id }}</td>
          <td>{{ r.cn }}</td>
          <td>{{ r.created_at }}</td>
          <td>{{ r.expires_at }}</td>
          <td>{{ r.status }}</td>
        </tr>
        {% else %}
        <tr><td colspan="5">Empty registry.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
