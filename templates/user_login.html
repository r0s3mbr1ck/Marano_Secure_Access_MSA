<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Portal - Marano Secure Access</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/msa-favicon.svg') }}">
  <style>
    :root {
      --bg-1: #0f1f5c;
      --bg-2: #142b79;
      --panel: rgba(22, 40, 104, 0.92);
      --panel-border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --input-bg: rgba(255,255,255,0.94);
      --input-text: #0f172a;
      --button: #52b6ff;
      --button-hover: #67c0ff;
      --shadow: 0 24px 60px rgba(0,0,0,0.38);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(96,165,250,0.18), transparent 28%),
        radial-gradient(circle at bottom left, rgba(59,130,246,0.14), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .login-shell {
      width: 100%;
      max-width: 760px;
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 54px 30px;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.14));
    }

    .brand-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 34px;
    }

    .flash {
      width: 100%;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.28);
      color: #fecaca;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .input-wrap {
      width: 100%;
      margin-bottom: 18px;
    }

    .input-wrap input {
      width: 100%;
      height: 74px;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 0 22px;
      background: rgba(255,255,255,0.94);
      color: #0f172a;
      font-size: 20px;
      font-weight: 500;
    }

    .submit-row {
      margin-top: 10px;
      width: 100%;
    }

    .submit-row button {
      width: 100%;
      height: 74px;
      border: none;
      outline: none;
      border-radius: 16px;
      background: var(--button);
      color: white;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-row button:hover {
      background: var(--button-hover);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .login-card { padding: 28px 20px 20px; }
      .brand-logo { width: 48px; height: 48px; }
      .brand-subtitle { font-size: 18px; }
      .input-wrap input, .submit-row button { height: 60px; font-size: 18px; }
      .submit-row button { font-size: 20px; }
      .footer { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand">
        <img class="brand-logo" src="{{ url_for('static', filename='img/msa-favicon.svg') }}" alt="MSA Logo">
      </div>

      <div class="brand-subtitle">
        User Portal
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash">{{ messages[0][1] }}</div>
        {% endif %}
      {% endwith %}

      <form method="post" autocomplete="off">
        <div class="input-wrap">
          <input name="username" placeholder="Username" required>
        </div>

        <div class="input-wrap">
          <input name="password" type="password" placeholder="Password" required>
        </div>

        <div class="submit-row">
          <button type="submit">Sign in</button>
        </div>
      </form>
      <div class="footer">
       <strong>MSA</strong> · Marano Secure Access<br>
       User Access Portal<br><br>
       <a href="{{ url_for('user_request_access') }}" style="color:#dbeafe; text-decoration:none; font-weight:700;">
        Request temporary access link
       </a>
      </div>
    </div>
  </div>
</body>
</html>
